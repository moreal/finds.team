spring:
  application:
    name: finds.team
  datasource:
    url: ${FINDS_DB_URL:jdbc:postgresql://localhost:55432/finds_team}
    username: ${FINDS_DB_USER:finds_app}
    password: ${FINDS_DB_PASSWORD:finds}
  flyway:
    url: ${FINDS_MIGRATION_DB_URL:${spring.datasource.url}}
    user: ${FINDS_MIGRATION_DB_USER:finds_migrator}
    password: ${FINDS_MIGRATION_DB_PASSWORD:finds}
    locations: classpath:db/migration
  task:
    scheduling:
      pool:
        size: 1
      thread-name-prefix: finds-scheduler-

logging:
  pattern:
    # Keep safe SLF4J structured fields visible in both default console and file appenders.
    level: "%5p %kvp"

server:
  error:
    whitelabel:
      enabled: false
  max-http-request-header-size: 16KB

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

finds:
  mail:
    sender: ${FINDS_MAIL_SENDER:verify@finds.team}
    sender-name: ${FINDS_MAIL_SENDER_NAME:finds.team}
    recording: ${FINDS_MAIL_RECORDING:false}
    encryption-key: ${FINDS_MAIL_ENCRYPTION_KEY:}
    active-key-version: ${FINDS_MAIL_ACTIVE_KEY_VERSION:1}
    scan-interval: 5s
    smtp:
      enabled: ${FINDS_MAIL_SMTP_ENABLED:false}
      priority: 100
      host: ${FINDS_MAIL_SMTP_HOST:}
      port: ${FINDS_MAIL_SMTP_PORT:587}
      tls: STARTTLS
      connect-timeout: 5s
      read-timeout: 10s
    ses:
      enabled: ${FINDS_MAIL_SES_ENABLED:false}
      priority: 50
      region: ${FINDS_MAIL_SES_REGION:}
    retry:
      max-attempts: 3
      initial-delay: 100ms
      maximum-delay: 1s
      jitter-ratio: 0.2
    dispatch:
      owner: ${FINDS_MAIL_LEASE_OWNER:${HOSTNAME:local}-mail}
      batch-size: 20
      lease-duration: 2m
      send-timeout: 30s
      max-attempts: 3
      retry-delays: [10s, 30s]
  source:
    user-agent-product: ${FINDS_USER_AGENT_PRODUCT:finds.team}
    robots-product-token: ${FINDS_ROBOTS_PRODUCT_TOKEN:findsteam}
    contact-url: ${FINDS_CONTACT_URL:https://finds.team/contact}
    connect-timeout: 5s
    request-timeout: 20s
    site-timeout: 60s
    minimum-host-spacing: 500ms
    maximum-response-bytes: 5242880
    maximum-redirects: 5
    robots-success-ttl: 24h
    robots-failure-ttl: 5m
    sitemap-maximum-depth: 4
    sitemap-maximum-documents: 100
    sitemap-maximum-urls: 50000
    sitemap-maximum-total-bytes: 20971520
  crawl:
    scan-interval: 15m
    success-interval: 6h
    retry-delays: [5m, 30m, 2h, 6h]
    lease-duration: 10m
    lease-owner: ${FINDS_LEASE_OWNER:${HOSTNAME:local}}
    dispatch-limit: 100
    global-concurrency: 3
    close-after-misses: 2
  graphql:
    maximum-request-bytes: 65536
