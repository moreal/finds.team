services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finds_team
      POSTGRES_USER: finds
      POSTGRES_PASSWORD: finds
    ports:
      - "${FINDS_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finds -d finds_team"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - finds-postgres-data:/var/lib/postgresql/data

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FINDS_DB_URL: jdbc:postgresql://postgres:5432/finds_team
      FINDS_DB_USER: finds
      FINDS_DB_PASSWORD: finds
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      FINDS_INTERNAL_GRAPHQL_URL: http://backend:8080/graphql
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  proxy:
    profiles: [app]
    image: caddy:2.11.4-alpine
    user: "65534:65534"
    ports:
      - "127.0.0.1:${FINDS_APP_PORT:-8080}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  finds-postgres-data:
