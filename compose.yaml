services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: finds_team
      POSTGRES_USER: finds
      POSTGRES_PASSWORD: finds
      FINDS_MIGRATION_DB_PASSWORD: ${FINDS_MIGRATION_DB_PASSWORD:-finds}
      FINDS_DB_PASSWORD: ${FINDS_DB_PASSWORD:-finds}
    ports:
      - "${FINDS_DB_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finds -d finds_team"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - finds-postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/00-create-runtime-role.sh:/docker-entrypoint-initdb.d/00-create-runtime-role.sh:ro

  postgres-roles:
    profiles: [app, tools]
    image: postgres:17-alpine
    environment:
      PGHOST: postgres
      POSTGRES_DB: finds_team
      POSTGRES_USER: finds
      PGPASSWORD: finds
      FINDS_MIGRATION_DB_PASSWORD: ${FINDS_MIGRATION_DB_PASSWORD:-finds}
      FINDS_DB_PASSWORD: ${FINDS_DB_PASSWORD:-finds}
    volumes:
      - ./deploy/postgres/00-create-runtime-role.sh:/bootstrap-roles.sh:ro
    entrypoint: [sh, /bootstrap-roles.sh]
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    profiles: [app]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      FINDS_DB_URL: jdbc:postgresql://postgres:5432/finds_team
      FINDS_DB_USER: finds_app
      FINDS_DB_PASSWORD: ${FINDS_DB_PASSWORD:-finds}
      FINDS_MIGRATION_DB_USER: finds_migrator
      FINDS_MIGRATION_DB_PASSWORD: ${FINDS_MIGRATION_DB_PASSWORD:-finds}
      # This Compose profile is explicitly local development: no external mail is sent.
      SPRING_PROFILES_ACTIVE: dev
      FINDS_MAIL_RECORDING: "true"
    depends_on:
      postgres:
        condition: service_healthy
      postgres-roles:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD-SHELL, "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 15s

  frontend:
    profiles: [app]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      FINDS_INTERNAL_GRAPHQL_URL: http://backend:8080/graphql
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 20
      start_period: 5s

  proxy:
    profiles: [app]
    image: caddy:2.11.4-alpine
    user: "65534:65534"
    ports:
      - "127.0.0.1:${FINDS_APP_PORT:-8080}:8080"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  finds-postgres-data:
